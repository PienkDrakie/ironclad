<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Poster Artist Credits</title>

    <style>
        body {
            margin: 0;
            padding: 30px 20px;
            background: #111;
            color: #eee;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        img.poster {
            width: 100%;
            display: block;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        h2 {
            margin-top: 40px;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }

        .artist {
            margin: 25px 0;
        }

        .artist-name {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .artist-role {
            color: #aaa;
            margin-top: 5px;
        }

        a {
            color: #fff;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>POSTER ARTIST CREDITS</h1>

    <p>
        Credits for the artwork created for
        <strong>CONCERT / BAND NAME</strong>.
    </p>

    <img
        class="poster"
        src="poster.jpg"
        alt="Concert poster"
    >

    <h2>Artists</h2>

    <div class="artist">
        <div class="artist-name">Artist Name</div>
        <div class="artist-role">Poster Artwork</div>
        <p>
            Short description about the artist or their contribution.
        </p>
        <a href="https://example.com">
            Artist website
        </a>
    </div>

    <div class="artist">
        <div class="artist-name">Second Artist</div>
        <div class="artist-role">Graphic Design</div>
        <p>
            Short description about their contribution.
        </p>
        <a href="https://example.com">
            Artist website
        </a>
    </div>

</div>

</body>
</html>
