<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ironclad — Event Credits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=New+Rocker&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <symbol id="corner-ornament" viewBox="0 0 40 40">
      <!-- outer frame bracket, pushed out to make room for the larger medallion -->
      <path d="M4 30 L4 4 L30 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/>
      <!-- nested inner bracket -->
      <path d="M13 30 L13 13 L30 13" fill="none" stroke="currentColor" stroke-width="1.1" opacity="0.6"/>
      <!-- rivet ticks along the arms -->
      <path d="M4 35 L4 39" stroke="currentColor" stroke-width="1.1" opacity="0.5"/>
      <path d="M35 4 L39 4" stroke="currentColor" stroke-width="1.1" opacity="0.5"/>
      <!-- mirrored filigree tendrils, symmetric about the corner diagonal -->
      <path d="M13 13 C13 19 18 19 18 24 C18 27 15 27 15 31" fill="none" stroke="currentColor" stroke-width="1.1" opacity="0.7" stroke-linecap="round"/>
      <path d="M13 13 C19 13 19 18 24 18 C27 18 27 15 31 15" fill="none" stroke="currentColor" stroke-width="1.1" opacity="0.7" stroke-linecap="round"/>
      <circle cx="15" cy="31" r="1.1" fill="currentColor" opacity="0.75"/>
      <circle cx="31" cy="15" r="1.1" fill="currentColor" opacity="0.75"/>
      <!-- larger double-ring star-cross medallion -->
      <circle cx="4" cy="4" r="6.5" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>
      <circle cx="4" cy="4" r="3.8" fill="none" stroke="currentColor" stroke-width="0.9" opacity="0.9"/>
      <path d="M4 -4.5 L5.6 4 L4 12.5 L2.4 4 Z" fill="currentColor"/>
      <path d="M-4.5 4 L4 2.4 L12.5 4 L4 5.6 Z" fill="currentColor" opacity="0.9"/>
    </symbol>
  </svg>

  <header class="hero">
    <div class="hero-texture"></div>
    <svg class="corner-ornament tl"><use href="#corner-ornament"/></svg>
    <svg class="corner-ornament tr"><use href="#corner-ornament"/></svg>
    <svg class="corner-ornament bl"><use href="#corner-ornament"/></svg>
    <svg class="corner-ornament br"><use href="#corner-ornament"/></svg>
    <div class="hero-inner">
      <p class="hero-eyebrow">Event Credits</p>
      <!-- Placeholder wordmark inspired by the band's WIP logo — swap for the finished logo file once it's ready -->
      <h1 class="hero-wordmark">
        <svg viewBox="0 0 600 160" role="img" aria-label="Ironclad">
          <defs>
            <filter id="wordmark-roughen" x="-20%" y="-20%" width="140%" height="140%">
              <feTurbulence type="fractalNoise" baseFrequency="0.012 0.06" numOctaves="2" seed="7" result="noise"/>
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
          </defs>
          <g filter="url(#wordmark-roughen)">
            <text x="300" y="120" font-size="120" text-anchor="middle" letter-spacing="-2" fill="currentColor" stroke="var(--bg)" stroke-width="2">IRONCLAD</text>
          </g>
        </svg>
      </h1>
    </div>
  </header>

  <main>
    <section class="credits" aria-labelledby="credits-heading">
      <div class="credits-header">
        <h2 id="credits-heading">The Crew</h2>
      </div>

      <div class="credits-grid" id="credits-grid">
        <!-- Cards are rendered here by script.js from people.js -->
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>IRONCLAD — <span id="footer-year"></span></p>
  </footer>

  <script src="people.js"></script>
  <script src="script.js"></script>
</body>
</html>
